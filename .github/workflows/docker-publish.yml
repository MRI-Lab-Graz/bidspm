name: Publish Docker image

# Manual only, on purpose: the image is a slow, ~4.6GB Octave/SPM build, publishing it is a decision
# (not a side effect of pushing a tag), and the tag you pick is the version users pin.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the image as (e.g. spm26-1.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          echo "tags=${IMAGE}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${IMAGE}:${{ inputs.tag }}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/dockerfile/dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
