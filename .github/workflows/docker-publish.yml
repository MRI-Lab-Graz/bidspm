name: Publish Docker image

# Manual only, on purpose: the image is a slow Octave/SPM build, publishing it is a decision
# (not a side effect of pushing a tag), and the version you give is the tag users pin.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v2.1.0)"
        required: true
      latest:
        description: "Also move the 'latest' tag to this build"
        type: boolean
        default: false

env:
  # = lib/config.py DEFAULT_DOCKER_IMAGE without its tag (tests/test_default_image.py keeps them in sync)
  IMAGE: ghcr.io/mri-lab-graz/spm-bids-runner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          TAGS="${IMAGE}:${{ inputs.version }}"
          if [ "${{ inputs.latest }}" = "true" ]; then TAGS="${TAGS},${IMAGE}:latest"; fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${TAGS}"

      # OCI labels (title, licences, source, upstream versions) come from the Dockerfile itself.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/dockerfile/dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            IMAGE_VERSION=${{ inputs.version }}
            GIT_REVISION=${{ github.sha }}
