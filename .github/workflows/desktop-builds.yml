name: Desktop Builds

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to a GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag (required when publish_release=true), e.g. v0.1.0"
        required: false
        type: string
      release_name:
        description: "Optional release title (defaults to release_tag)"
        required: false
        type: string
      prerelease:
        description: "Mark GitHub Release as pre-release"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - feat/frontend-migration-datalad-desktop
    paths:
      - frontend_desktop/**
      - .github/workflows/desktop-builds.yml

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            script: dist:linux
            artifact_name: bidspm-desktop-linux
          - os: macos-latest
            label: macOS
            script: dist:mac
            artifact_name: bidspm-desktop-macos
          - os: windows-latest
            label: Windows
            script: dist:win
            artifact_name: bidspm-desktop-windows

    defaults:
      run:
        working-directory: frontend_desktop

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_desktop/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build desktop artifacts
        run: npm run ${{ matrix.script }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            frontend_desktop/dist/*.AppImage
            frontend_desktop/dist/*.deb
            frontend_desktop/dist/*.tar.gz
            frontend_desktop/dist/*.dmg
            frontend_desktop/dist/*.zip
            frontend_desktop/dist/*.exe
            frontend_desktop/dist/*.blockmap
            frontend_desktop/dist/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true && inputs.release_tag != '' }}
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Show collected release files
        run: |
          echo "Collected files for release:"
          find release-artifacts -maxdepth 2 -type f | sort

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.tar.gz
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/*.blockmap
            release-artifacts/latest*.yml
